name: Validate release tag

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          bun -e '
          const pkg = JSON.parse(await Bun.file("packages/android-reverse-tcp/package.json").text());
          const expected = `v${pkg.version}`;
          const actual = process.env.GITHUB_REF_NAME;
          if (actual && actual !== expected) {
            console.error(`Tag ${actual} does not match package version ${pkg.version}. Expected ${expected}.`);
            process.exit(1);
          }
          '

      - name: Run workspace checks
        run: bun run check
